[project]
name = "vellum"
version = "0.2.0"
description = "LLM inference benchmarking, plus a from-scratch Mistral 7B engine optimized one measured step at a time"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# The from-scratch Mistral 7B (vellum.mistral). CPU torch is enough for its tests; pyarrow reads
# the WikiText-2 parquet files AWQ calibrates and is evaluated on.
mistral = ["torch>=2.5", "safetensors>=0.4", "huggingface_hub>=0.20", "mistral_common[sentencepiece]>=1.0", "pyarrow>=14"]
# Only installable on a Linux + NVIDIA GPU box.
gpu = ["vllm"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
vellum = "vellum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vellum"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
