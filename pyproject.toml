[project]
name = "vellum"
version = "0.1.0"
description = "Throughput/latency benchmarking of vLLM serving across concurrency levels and quantization schemes"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Only installable on a Linux + NVIDIA GPU box.
gpu = ["vllm"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
vellum = "vellum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vellum"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
